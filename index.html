  }else if(stab==="picks"){
    body=`<div class="grid g2"><div class="card"><h3>Add Earn pick</h3><div class="inline"><div><label>Asset</label><input id="e_asset" placeholder="USDT"></div><div><label>Product</label><input id="e_prod" placeholder="Flexible / Locked 30d"></div><div><label>APR %</label><input id="e_apr" type="number" step="any"></div><div><label>Term</label><input id="e_term" placeholder="Flexible"></div></div><label>Note</label><input id="e_note"><label class="row" style="color:#fff"><input type="checkbox" id="e_hot" style="width:auto" checked> Mark as 🔥 Hot</label><button class="btn primary" style="margin-top:12px" id="e_add">Add pick</button></div>

    <h3 style="margin:18px 0 10px">New tokens</h3>${(P.new_tokens||[]).map((r,i)=>`<div class="row" style="margin-bottom:6px"><span>${esc(r.asset)} · ${esc(r.note||"")}</span><a href="#" data-deln="${i}">delete</a></div>`).join("")||`<div class="small dim">None yet.</div>`}`;

  view.querySelectorAll("[data-deln]").forEach(a=>a.onclick=e=>{e.preventDefault();P.new_tokens.splice(+a.dataset.deln,1);rerender()});
  view.querySelectorAll("[data-copy-el]").forEach(b=>b.onclick=()=>copy($("#"+b.dataset.copyEl).value,"Copied — paste into the file on GitHub"));
  view.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{const blob=new Blob([$("#"+b.dataset.el).value],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=b.dataset.dl;a.click()});
}
const findInList=(arr,c)=>(arr||[]).find(a=>a.code===c);

/* ---------- boot / routing ---------- */
function route(){
  captureRef();const h=parseHash();
  if(h.name==="studio"||h.name==="udw"){studio();window.scrollTo(0,0);return}
  if(!$("#ways")||!view.querySelector("#ways"))home();
  const id=h.name&&$("#"+h.name)?h.name:(h.name==="invite"?"join":"");
  if(id)setTimeout(()=>$("#"+id).scrollIntoView(),30);else if(!h.name)window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>{const h=parseHash();if(h.name==="studio"||h.name==="udw"){studio();return}if(!view.querySelector("#ways")){home();}captureRef();const id=h.name==="invite"?"join":h.name;if(id&&$("#"+id))$("#"+id).scrollIntoView()});
(async function boot(){
  captureRef();
  [LEDGER,PICKS]=await Promise.all([loadJSON("data/ledger.json",DEFAULT_LEDGER),loadJSON("data/picks.json",DEFAULT_PICKS)]);
  route();
  await loadLive();
  if(!["studio","udw"].includes(parseHash().name)){const t=$("#topbox");if(t){t.innerHTML=topTable();$("#newbox").innerHTML=newTokens()}}
})();
})();
